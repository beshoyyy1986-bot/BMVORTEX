kind = "web"
previewPath = "/"
title = "Vortex — Control Panel"
version = "1.0.0"
id = "artifacts/vortex"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22676

[services.development]
run = "pnpm --filter @workspace/vortex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vortex", "run", "build" ]
serve = "static"
publicDir = "artifacts/vortex/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22676"
BASE_PATH = "/"
