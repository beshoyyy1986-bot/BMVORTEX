<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      background: linear-gradient(135deg, #2c3e50, #e67e22);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      color: white;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 24px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .button-container {
      display: grid;
      gap: 15px;
    }
    
    .btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 15px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
    
    .copied {
      color: #2ecc71;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>VORTEX</h1>
  </div>
  
  <div class="button-container">
    <div class="btn" id="copyCookiesJson">Copy Cookies (JSON)</div>
    <div class="btn" id="copyCookiesString">Copy Cookies (String)</div>
    <div class="btn" id="copyToken">Copy Token</div>
    <div class="btn" id="copyAccountData">Copy Account Data</div>
  </div>
  
  <div class="status" id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
